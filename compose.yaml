name: ecotrace

services:
  db:
    image: mysql:8
    container_name: ecotrace-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecotrace
      MYSQL_USER: ecotrace_user
      MYSQL_PASSWORD: ecotrace_pass
      MYSQL_ROOT_PASSWORD: ecotrace_root_pass
    ports:
      - "3307:3306"
    volumes:
      - ecotrace_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ecotrace_user", "-pecotrace_pass"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7
    container_name: ecotrace-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ecotrace_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ecotrace_mysqldata:
  ecotrace_mongodata:
